<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript test</title>
</head>

<body>
    <img src="cookie.jpg" width="200" onclick="addScore()">
    <div id="scoreBox">0</div>
    <button onclick="buyMulti()">Buy Upgrade-10 points</button>
    <button onclick="buyAutoclick()">Buy AutoClick</button>
</body>

<script>
    var name = prompt("what is your name?")
    name = name.toLowerCase()
    if (name == "vadim") {
        document.write("Hey! You owe me five bucks!")
    }
    else {
        document.write("hello, " + name + "!");
    }

    var score = 0;
    var multiplier = 1.0;
    var autoclickamount = 0;
    var scoreBox = document.getElementById("scoreBox");

    function addScore() {
        score = score + multiplier;
        scoreBox.innerHTML = score;
    }

    function buyMulti() {
        if (score >= (multiplier * 10)) {
            score = score - (multiplier * 10)
            multiplier = multiplier + 0.1;
            scoreBox.innerHTML = score;
        }
    }

    function buyAutoclick() {
        if (autoclickamount == 0) {
            autoclickamount = 1;
            setInterval(
                () => {
                    score = score + autoclickamount;
                    scoreBox.innerHTML = score;
                },
                1000
            )
        }

        else {

        }

    }


</script>

</html>
